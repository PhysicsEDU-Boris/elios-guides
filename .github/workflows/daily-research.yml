name: daily-research

on:
  schedule:
    - cron: "0 20 * * *" # 03:00 WIB, every day
  workflow_dispatch:
    inputs:
      date:
        description: "Issue date YYYY-MM-DD (empty = today in Asia/Jakarta)"
        required: false
        type: string
      dry_run:
        description: "Dry run: write to guide/dry-run-<date>, never Figma, export or publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      date: ${{ steps.date.outputs.date }}
      skip: ${{ steps.date.outputs.skip }}
      branch: ${{ steps.date.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && github.ref || 'main' }}
          persist-credentials: false
      - name: Pick date and skip if it exists
        id: date
        env:
          INPUT_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DATE="${INPUT_DATE:-$(TZ=Asia/Jakarta date +%F)}"
          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "::error::bad date '$DATE'"; exit 1; fi
          BRANCH="guide/$DATE"
          if [ "$DRY_RUN" = "true" ]; then BRANCH="guide/dry-run-$DATE"; fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if { [ "$DRY_RUN" != "true" ] && [ -d "issues/$DATE" ]; } || git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "issues/$DATE already exists on main or $BRANCH; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  research:
    needs: prep
    if: needs.prep.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: guide-${{ needs.prep.outputs.date }}
    env:
      DATE: ${{ needs.prep.outputs.date }}
      BRANCH: ${{ needs.prep.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Dry runs test the dispatched branch's scripts; real runs always use main.
          ref: ${{ inputs.dry_run && github.ref || 'main' }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Read the published catalogue
        run: |
          mkdir -p .gemini
          git fetch origin published
          git show FETCH_HEAD:manifest.json > .gemini/published-manifest.json

      - name: Research and write
        id: research
        continue-on-error: true # partial files still go to a NEEDS FIX PR
        timeout-minutes: 35
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true" # headless CI; without it the CLI refuses to run
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: "0.67.0"
          # Keep debug off: its stderr becomes an action output and can exceed GitHub's object-size limit.
          # Free tier: Pro = 0 RPD, Flash = 5 RPM / 20 RPD. Flash Lite = 15 RPM / 250K TPM.
          # Research and fact-check use different models so each gets its own daily quota.
          # Per-minute 429s are retried with backoff by the CLI (general.maxAttempts, default 10).
          # web search/fetch and loop checks ignore gemini_model and use gemini-3-flash-base
          # (gemini-3-flash-preview, 5 RPM) and gemini-3-pro-preview (0 RPD); the settings below point
          # them at the other Flash Lite model so the chat and its tools don't share one RPM limit.
          gemini_model: gemini-3.5-flash-lite
          # Allowlist: no shell, no edit/replace tool. Gemini CLI cannot limit writes to one folder,
          # so the "Only issues/<date> changed" step below enforces that.
          settings: |
            {"model": {"maxSessionTurns": 60}, "privacy": {"usageStatisticsEnabled": false}, "modelConfigs": {"customAliases": {"gemini-3-flash-base": {"extends": "base", "modelConfig": {"model": "gemini-3.1-flash-lite"}}, "loop-detection-double-check": {"extends": "base", "modelConfig": {"model": "gemini-3.1-flash-lite"}}}}, "tools": {"core": ["google_web_search", "web_fetch", "read_file", "write_file", "list_directory"]}}
          prompt: >-
            Follow GEMINI.md exactly. Today is ${{ needs.prep.outputs.date }} (Asia/Jakarta).
            Write issues/${{ needs.prep.outputs.date }}/en.json, id.json, calc.py and sources.md.

      - name: Keep only the files research may write
        # Gemini can read scripts/validate.py and once forged calc.out.json, check.json and cover.jpg.
        run: mkdir -p "issues/$DATE" && find "issues/$DATE" -type f ! -name en.json ! -name id.json ! -name calc.py ! -name sources.md -print -delete

      - name: Fact-check
        id: factcheck
        continue-on-error: true
        timeout-minutes: 15
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true" # headless CI; without it the CLI refuses to run
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: "0.67.0"
          # Stronger than Flash-Lite. Free tier Flash: 5 RPM / 20 RPD, used only here, so turns stay under 20.
          # Override with the repository variable FACTCHECK_MODEL (e.g. after a paid key).
          gemini_model: ${{ vars.FACTCHECK_MODEL || 'gemini-3-flash-preview' }}
          settings: |
            {"model": {"maxSessionTurns": 18}, "privacy": {"usageStatisticsEnabled": false}, "modelConfigs": {"customAliases": {"gemini-3-flash-base": {"extends": "base", "modelConfig": {"model": "gemini-3.5-flash-lite"}}, "loop-detection-double-check": {"extends": "base", "modelConfig": {"model": "gemini-3.5-flash-lite"}}}}, "tools": {"core": ["google_web_search", "web_fetch", "read_file", "write_file", "list_directory"]}}
          prompt: >-
            You did not write these files. Open every source URL in issues/${{ needs.prep.outputs.date }}/en.json
            and check every number, date, name and quiz answer, and that id.json says the same as en.json.
            Write issues/${{ needs.prep.outputs.date }}/check.json as [{item, claim, source, pass, note}].
            Mark pass=false if you cannot confirm it. Do not change any other file.

      - name: Fact-check again with Flash-Lite (stronger model out of quota)
        id: factcheck_lite
        if: steps.factcheck.outcome != 'success' || hashFiles(format('issues/{0}/check.json', env.DATE)) == ''
        continue-on-error: true
        timeout-minutes: 15
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true" # headless CI; without it the CLI refuses to run
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: "0.67.0"
          gemini_model: gemini-3.1-flash-lite
          settings: |
            {"model": {"maxSessionTurns": 40}, "privacy": {"usageStatisticsEnabled": false}, "modelConfigs": {"customAliases": {"gemini-3-flash-base": {"extends": "base", "modelConfig": {"model": "gemini-3.5-flash-lite"}}, "loop-detection-double-check": {"extends": "base", "modelConfig": {"model": "gemini-3.5-flash-lite"}}}}, "tools": {"core": ["google_web_search", "web_fetch", "read_file", "write_file", "list_directory"]}}
          prompt: >-
            You did not write these files. Open every source URL in issues/${{ needs.prep.outputs.date }}/en.json
            and check every number, date, name and quiz answer, and that id.json says the same as en.json.
            Write issues/${{ needs.prep.outputs.date }}/check.json as [{item, claim, source, pass, note}].
            Mark pass=false if you cannot confirm it. Do not change any other file.

      - name: Keep only check.json from the fact-check
        run: mkdir -p "issues/$DATE" && find "issues/$DATE" -type f ! -name en.json ! -name id.json ! -name calc.py ! -name sources.md ! -name check.json -print -delete

      - name: Calc
        id: calc
        continue-on-error: true
        run: python scripts/run_calc.py "issues/$DATE"

      - name: Only issues/<date> changed
        run: |
          bad=$(git status --porcelain --untracked-files=all | cut -c4- | grep -v -e "^issues/$DATE/" -e '^\.gemini/' -e '^gemini-artifacts/' || true)
          if [ -n "$bad" ]; then
            echo "::error::Files outside issues/$DATE were changed:"
            echo "$bad"
            exit 1
          fi

      - name: Fetch images
        id: images
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/fetch_images.py "issues/$DATE" | tee "$RUNNER_TEMP/images.txt"

      - name: First check
        id: check1
        run: |
          set +e
          python scripts/validate.py "issues/$DATE" --manifest .gemini/published-manifest.json --check-sources > "$RUNNER_TEMP/check1.txt" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/check1.txt"
          echo "ok=$([ "$code" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          { echo "problems<<ELIOS_EOF"; cat "$RUNNER_TEMP/check1.txt"; echo "ELIOS_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Repair
        # One short Gemini pass on the exact problem list; most failures are a few chars over a limit.
        id: repair
        if: steps.check1.outputs.ok != 'true' && hashFiles(format('issues/{0}/en.json', env.DATE)) != ''
        continue-on-error: true
        timeout-minutes: 10
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: "0.67.0"
          gemini_model: gemini-3.5-flash-lite
          settings: |
            {"model": {"maxSessionTurns": 30}, "privacy": {"usageStatisticsEnabled": false}, "modelConfigs": {"customAliases": {"gemini-3-flash-base": {"extends": "base", "modelConfig": {"model": "gemini-3.1-flash-lite"}}, "loop-detection-double-check": {"extends": "base", "modelConfig": {"model": "gemini-3.1-flash-lite"}}}}, "tools": {"core": ["google_web_search", "web_fetch", "read_file", "write_file", "list_directory"]}}
          prompt: >-
            Follow GEMINI.md. issues/${{ env.DATE }}/en.json and id.json failed these checks:
            ${{ steps.check1.outputs.problems }}
            Fix only these problems, in both files, and keep en.json and id.json saying the same thing.
            Over a limit: shorten the text, keep the facts and [n] tags. Image not downloaded: set
            source_url to a direct image file you open and confirm, with its real license and credit,
            or set the image to null and use "Illustration by ELIOS" in the credits. Source that
            doesn't exist: replace it with the exact page you open, with its real title and date.
            Change nothing else and write no other files.

      - name: Keep only the files repair may write
        if: steps.repair.outcome != 'skipped'
        run: |
          mkdir -p "issues/$DATE" && find "issues/$DATE" -type f ! -name en.json ! -name id.json ! -name calc.py ! -name sources.md ! -name check.json -print -delete
          # undo anything repair changed outside issues/ (scripts, tests, manifest) before the final check
          git ls-files -m | grep -v '^issues/' | xargs -r git checkout --
          git clean -fdq -e issues/ -e .gemini/ -e gemini-artifacts/

      - name: Calc and images again
        if: steps.repair.outcome != 'skipped'
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/run_calc.py "issues/$DATE" || true
          # last attempt: a photo that still fails the size/sharpness/JPEG checks becomes null
          python scripts/fetch_images.py "issues/$DATE" --drop-failed | tee "$RUNNER_TEMP/images.txt"

      - name: Discard the fact-check of the unrepaired files
        if: steps.repair.outcome != 'skipped'
        run: rm -f "issues/$DATE/check.json"

      - name: Fact-check the repaired files
        if: steps.repair.outcome != 'skipped'
        id: recheck
        continue-on-error: true
        timeout-minutes: 10
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: "0.67.0"
          gemini_model: gemini-3.1-flash-lite
          settings: |
            {"model": {"maxSessionTurns": 30}, "privacy": {"usageStatisticsEnabled": false}, "modelConfigs": {"customAliases": {"gemini-3-flash-base": {"extends": "base", "modelConfig": {"model": "gemini-3.5-flash-lite"}}, "loop-detection-double-check": {"extends": "base", "modelConfig": {"model": "gemini-3.5-flash-lite"}}}}, "tools": {"core": ["google_web_search", "web_fetch", "read_file", "write_file", "list_directory"]}}
          prompt: >-
            You did not repair these files. Read the current issues/${{ env.DATE }}/en.json and id.json.
            Open every source URL and check every number, date, name and quiz answer, bilingual agreement,
            and the required Indonesian labels in GEMINI.md. Check the current files, not earlier errors.
            Write issues/${{ env.DATE }}/check.json as [{item, claim, source, pass, note}].
            Mark pass=false if you cannot confirm it. Do not change any other file.

      - name: Validate
        id: validate
        env:
          RESEARCH: ${{ steps.research.outcome }}
          CALC: ${{ steps.calc.outcome }}
          FACTCHECK: ${{ steps.factcheck.outcome }}
          FACTCHECK_LITE: ${{ steps.factcheck_lite.outcome }}
          RECHECK: ${{ steps.recheck.outcome }}
          DRY_RUN: ${{ inputs.dry_run }}
          IMAGES: ${{ steps.images.outcome }}
          REPAIR: ${{ steps.repair.outcome }}
        run: |
          set +e
          # --check-sources opens every source url (Gemini's fact-check once approved invented ones).
          python scripts/validate.py "issues/$DATE" --manifest .gemini/published-manifest.json --check-sources > "$RUNNER_TEMP/validate.txt" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/validate.txt"
          cat "$RUNNER_TEMP/validate.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "ok=$([ "$code" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          PREFIX=""
          if [ "$DRY_RUN" = "true" ]; then PREFIX="DRY RUN · "; fi
          if [ "$code" -eq 0 ]; then
            echo "title=${PREFIX}ELIOS Guide $DATE · waiting for Figma" >> "$GITHUB_OUTPUT"
          else
            echo "title=${PREFIX}ELIOS Guide $DATE · NEEDS FIX" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "Automated research for **$DATE** (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo "Steps: research **$RESEARCH** · calc **$CALC** · fact-check **$FACTCHECK** (Flash-Lite fallback **$FACTCHECK_LITE**) · images **$IMAGES** · repair **$REPAIR** · repaired fact-check **$RECHECK**"
            echo
            echo "Photos (long side px, Laplacian variance, estimated JPEG quality):"
            echo '```'
            cat "$RUNNER_TEMP/images.txt" 2>/dev/null || echo "no image step output"
            echo '```'
            echo
            echo '```'
            cat "$RUNNER_TEMP/validate.txt"
            echo '```'
            echo
            if [ "$code" -eq 0 ]; then
              echo "Next: the 05:00 WIB Claude task fills Figma and pushes figma.json, which starts the PDF export."
            else
              echo "Fix the files on this branch (or re-run with workflow_dispatch after deleting the branch). The Claude task skips NEEDS FIX PRs."
            fi
          } > "$RUNNER_TEMP/body.md"

      - name: Open draft PR
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.BRANCH }}
          base: main
          add-paths: issues/${{ env.DATE }}
          commit-message: "guide: research ${{ env.DATE }}"
          title: ${{ steps.validate.outputs.title }}
          body-path: ${{ runner.temp }}/body.md
          draft: true

      - name: Mark the run failed if validation failed
        if: steps.validate.outputs.ok != 'true'
        run: |
          echo "::error::Validation failed or research did not finish; see the NEEDS FIX PR (if files were written) or the Validate step."
          exit 1
