name: publish

on:
  workflow_call:
    inputs:
      date:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      date:
        description: 'Validated exported issue date (YYYY-MM-DD)'
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-guide-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate date
        env:
          ISSUE_DATE: ${{ inputs.date }}
        run: |
          [[ "$ISSUE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 1
      - uses: actions/checkout@v4
        with:
          ref: main # the checks that apply are main's, also when called from a guide/<date> push
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: guide/${{ inputs.date }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: published
          path: site
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Validate and prepare public files
        env:
          ISSUE_DATE: ${{ inputs.date }}
        run: python tools/scripts/publish.py "$ISSUE_DATE" source site --check-sources
      - name: Save published archive
        env:
          ISSUE_DATE: ${{ inputs.date }}
        working-directory: site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json .nojekyll "issues/$ISSUE_DATE"
          git diff --cached --quiet || git commit -m "publish: issue $ISSUE_DATE"
          git push origin HEAD:published
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record publication
        env:
          ISSUE_DATE: ${{ inputs.date }}
        run: echo "Published ELIOS Guide $ISSUE_DATE (EN + ID)." >> "$GITHUB_STEP_SUMMARY"
