name: test

on:
  pull_request:
    # guide PRs only add issue files and update the manifest; nothing for pytest to test
    paths-ignore:
      - "issues/**"
      - "manifest.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
